[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkharness"
version = "0.1.0"
description = "Linux execution foundation and explicit Windows Host Bridge"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.optional-dependencies]
band = ["band-sdk[codex]==4.0.0"]

[tool.setuptools.packages.find]
include = ["darkharness*"]
